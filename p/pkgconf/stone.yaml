name        : pkgconf
version     : "3.0.7"
release     : 15
summary     : Package compiler and linker metadata toolkit
license     : ISC
homepage    : https://gitea.treehouse.systems/ariadne/pkgconf
description : |
    Package compiler and linker metadata toolkit
upstreams   :
    - https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.7.tar.gz: 028889796fd6d556e019d35b8e8d68d321cbb5cf9827d3ea7653625629641345
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
    ln -sf pkgconf %(installroot)/usr/bin/pkg-config
packages    :
    - "%(name)":
        paths:
            - /usr/share/aclocal/pkg.m4
