name        : plasma-wayland-protocols
version     : "1.22.0"
release     : 8
upstreams   :
    - https://download.kde.org/stable/plasma-wayland-protocols/plasma-wayland-protocols-1.22.0.tar.xz : f628585c4c2d5e3a9f447a6274e2f59d7811272da557e75341e36948aa3f9d43
homepage    : https://kde.org/plasma-desktop
license     : LGPL-2.1-or-later
summary     : Persistent platform-independent application settings.
description : |
    Persistent platform-independent application settings.
builddeps   :
    - cmake(ECM)
    - pkgconfig(wayland-scanner)
setup       : |
    # For whatever reason one of the cmake options added by the cmake_kf6 macro tries to make this pull in qt5
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        paths:
            - /usr/share/cmake/PlasmaWaylandProtocols/
