name        : polkit-kde-agent
version     : "6.7.5"
release     : 23
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/polkit-kde-agent-1-6.7.5.tar.xz : fb731dd979c0296994b5efe37b0a9cdeec5e704f91565540930effdbd7efee58
homepage    : https://kde.org/plasma-desktop/
license     : GPL-2.0-or-later
summary     : Daemon providing a polkit authentication for KDE
description : |
    Daemon providing a polkit authentication for KDE
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6Crash)
    - cmake(KF6DBusAddons)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
    - cmake(KF6WindowSystem)
    - cmake(PolkitQt6-1)
    - cmake(Qt6Quick)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
