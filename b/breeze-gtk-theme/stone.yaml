name        : breeze-gtk-theme
version     : "6.7.5"
release     : 22
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/breeze-gtk-6.7.5.tar.xz : 4e0e913b0515de75492155d028c086c4a522a3f68ebb6f4fab10f8bc646cd518
homepage    : https://kde.org/plasma-desktop/
license     :
    - BSD-3-Clause
    - LGPL-2.1-only
summary     : GTK Theme Built to Match KDE's Breeze
description : |
    A GTK Theme Built to Match KDE's Breeze
builddeps   :
    - binary(python3)
    - binary(sassc)
    - cmake(Breeze)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(cairo)
    - python(pycairo)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
