name        : kf6-kcompletion
version     : "6.30.0"
release     : 22
upstreams   :
    - https://download.kde.org/stable/frameworks/6.30/kcompletion-6.30.0.tar.xz : 96ad9c429ca53b830359c45614ca4c32ed6b759f3023f1b3db1650ba1c19bd58
homepage    : https://community.kde.org/Frameworks
license     :
    - BSD-3-Clause
    - LGPL-2.0-or-later
    - LGPL-2.1-or-later
summary     : Powerful completion framework, including completion-enabled lineedit and combobox.
