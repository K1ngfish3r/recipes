name        : kf6-karchive
version     : "6.30.0"
release     : 24
upstreams   :
    - https://download.kde.org/stable/frameworks/6.30/karchive-6.30.0.tar.xz : 4cf89d91e429d2ece3110e78f7ef7011952b0412cb15011329516b46f21e98e2
homepage    : https://community.kde.org/Frameworks
license     : LGPL-2.0-or-later
summary     : Reading, creating, and manipulating file archives.
description : |
    Reading, creating, and manipulating file archives.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(bzip2)
    - pkgconfig(liblzma)
    - pkgconfig(openssl)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
