name        : gpgmepp
version     : "2.2.0"
release     : 7
homepage    : https://gnupg.org/software/gpgme/index.html
upstreams   :
    - https://www.gnupg.org/ftp/gcrypt/gpgmepp/gpgmepp-2.2.0.tar.xz : 6651c5f7f801543d5b676719df9fec8053b0a6f5aba40b98ca0d2bee11136f30
summary     : GnuPG Made Easy library (C++ bindings)
description : |
    GnuPG Made Easy (GPGME) is a library designed to make access to GnuPG easier
    for applications. It provides a High-Level Crypto API for encryption,
    decryption, signing, signature verification and key management.
license     :
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
builddeps   :
    - pkgconfig(gpg-error)
    - pkgconfig(gpgme)
setup       : |
    %cmake
build       : |
    %cmake_build
install     : |
    %cmake_install
