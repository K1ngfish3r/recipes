name        : union
version     : "6.7.5"
release     : 4
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/union-6.7.5.tar.xz : deea749acb710357e56fce07198e3de3bad4bdfa95298e185e38eb8938f8d2c8
homepage    : https://kde.org/plasma-desktop/
license     :
    - LGPL-2.1-only
    - LGPL-3.0-only
summary     : A Qt style supporting both QtQuick and QtWidgets
description : |
    A Qt style supporting both QtQuick and QtWidgets
builddeps   :
    - cmake(Breeze)
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6ColorScheme)
    - cmake(KF6CoreAddons)
    - cmake(KF6GuiAddons)
    - cmake(KF6IconThemes)
    - cmake(KF6KirigamiPlatform)
    - cmake(Qt6ShaderTools)
    - cmake(cxx-rust-cssparser)
rundeps     :
    - breeze
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6 \
        -DBUILD_OUTPUT_QTWIDGETS=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
