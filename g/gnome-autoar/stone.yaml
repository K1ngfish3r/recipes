name        : gnome-autoar
version     : "0.5.2"
release     : 6
homepage    : https://gitlab.gnome.org/GNOME/gnome-autoar
upstreams   :
    - https://download.gnome.org/sources/gnome-autoar/0.5/gnome-autoar-0.5.2.tar.xz : 6c20bd16c87aba15869e56444424481f632ac302989a203e8ce4dcc73dea33a5
summary     : Automatic archive functions for GNOME apps
description : |
    Automatic archive functions for GNOME apps
license     :
    - LGPL-2.1-or-later
builddeps   :
    - binary(gi-docgen)
    - pkgconfig(gio-2.0)
    - pkgconfig(glib-2.0)
    - pkgconfig(gobject-2.0)
    - pkgconfig(gobject-introspection-1.0)
    - pkgconfig(libarchive)
    # - pkgconfig(gtk+-3.0)
    - binary(vapigen)
setup       : |
    %meson \
        -Dintrospection=enabled \
        -Dvapi=true
build       : |
    %meson_build
install     : |
    %meson_install
