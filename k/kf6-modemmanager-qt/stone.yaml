name        : kf6-modemmanager-qt
version     : "6.30.0"
release     : 17
upstreams   :
    - https://download.kde.org/stable/frameworks/6.30/modemmanager-qt-6.30.0.tar.xz : d7c4106dc130729fdfd435abaeaf85039a874fc18563a41755e14f7ea174ae21
homepage    : https://community.kde.org/Frameworks
license     :
    - BSD-3-Clause
    - GPL-2.0-only
    - LGPL-2.1-only
summary     : Qt wrapper for ModemManager DBus API
description : |
    Qt wrapper for ModemManager DBus API
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - pkgconfig(ModemManager)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - pkgconfig(ModemManager)
