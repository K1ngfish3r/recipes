name        : fcitx5-m17n
version     : "5.1.6"
release     : 1
homepage    : https://github.com/fcitx/fcitx5-m17n
upstreams   :
    - https://github.com/fcitx/fcitx5-m17n/archive/refs/tags/5.1.6.tar.gz : 0070ed245bfb4153d13d5906c1afae4314cd4a0592cb3cd0e7b31a1e5d114932
