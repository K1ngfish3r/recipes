name        : kdecoration
version     : "6.7.5"
release     : 25
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/kdecoration-6.7.5.tar.xz : 7ff1fe2854ca08a21a1ba47f1b0c97d12ea24f1db618631319cba4023ca53d86
homepage    : https://kde.org/plasma-desktop/
license     : LGPL-2.1-only
summary     : Plugin based library to create window decorations
