name        : bpf-linker
version     : "0.11.1"
release     : 2
upstreams   :
    - https://github.com/aya-rs/bpf-linker/archive/refs/tags/v0.11.1.tar.gz: 9e7791bb5edaab7670e15ade3cc1df549cf5f672401b52c354643e9e9d6de31c
homepage    : https://github.com/aya-rs/bpf-linker
license     :
    - Apache-2.0
    - MIT
summary     : Simple BPF static linker
description : |
    BPF static linker
builddeps   :
    # Needs to match whatever Rust is using, which I _think_ just means the system llvm
    - binary(llvm-config-23)
networking  : true
setup       : |
    %cargo_fetch
build       : |
    %cargo_build
install     : |
    %cargo_install
    %install_file README.md "%(installroot)%(datadir)/doc/bpf-linker/README.md"
