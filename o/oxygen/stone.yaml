name        : oxygen
version     : "6.7.5"
release     : 4
homepage    : https://kde.org/plasma-desktop/
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/oxygen-6.7.5.tar.xz: ffa4b969197f6e09a6ee4f468925e67223666d761ee9801a8ea612e09b756037
summary     : Qt Oxygen Theme
description : |
    The Oxygen Style for Qt/KDE Applications
license     : LGPL-3.0-or-later
tuning      :
    - lto: full
    - optimize: speed
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    # NOTE: this comment was taken from the kde breeze package
    - cmake(ECM)
    - cmake(KDecoration3)
    - cmake(KF6Completion)
    - cmake(KF6CoreAddons)
    - cmake(KF6FrameworkIntegration)
    - cmake(KF6GuiAddons)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KCMUtils)
    - cmake(KF6Service)
    - cmake(KF6WindowSystem)
    - cmake(Plasma)
    - cmake(Qt6GuiPrivate)
    - cmake(Qt6Svg)
setup       : |
    %cmake_kf6 \
        -DBUILD_QT5=OFF \
        -DBUILD_QT6=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)":
        rundeps:
            - "%(name)-cursor-themes"
            - oxygen-icon-theme
            - oxygen-sounds

    - "%(name)-cursor-themes":
        summary: Oxygen cursor themes
        description: Oxygen cursor themes
        paths:
            - /usr/share/icons/
