name        : mesa-libclc
version     : "22.1.8.3"
release     : 1
upstreams   :
    - https://gitlab.freedesktop.org/karolherbst/mesa-libclc/-/archive/22.1.8.3/mesa-libclc-22.1.8.3.tar.gz : d6fc17db2c4ae20ecfe04060af0572b2ab3701bb13822dab93efcaca0675205e
homepage    : https://gitlab.freedesktop.org/karolherbst/mesa-libclc
