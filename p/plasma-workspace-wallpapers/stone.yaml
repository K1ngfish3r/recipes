name        : plasma-workspace-wallpapers
version     : "6.7.5"
release     : 22
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/plasma-workspace-wallpapers-6.7.5.tar.xz : c481ac4b937a2b1b080c3273e0557cd0c9d57b644156b941902483fd8e1646b5
homepage    : https://kde.org/plasma-desktop/
license     :
    - GPL-2.0-or-later
