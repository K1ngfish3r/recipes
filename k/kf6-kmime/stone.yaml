name        : kf6-kmime
version     : "6.30.0"
release     : 4
upstreams   :
    - https://download.kde.org/stable/frameworks/6.30/kmime-6.30.0.tar.xz : 2969a5ef484e98f91bf78e88c98a9d613bdd3bb86ac154ceece0557b70f373bc
homepage    : https://kde.org
license     : LGPL-2.1-or-later
summary     : KMime is a library for handling mail messages and newsgroup articles
description : |
    KMime is a library for handling mail messages and newsgroup articles.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Codecs)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
packages    :
    - "%(name)-devel":
        rundeps:
            - cmake(KF6Codecs)
