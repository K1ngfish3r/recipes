name        : kf6-kholidays
version     : "6.30.0"
release     : 24
upstreams   :
    - https://download.kde.org/stable/frameworks/6.30/kholidays-6.30.0.tar.xz : 02bfbc33296fe86b364491f6d5cad9d83360bb4fdd2923386a325b309eac0b9b
homepage    : https://community.kde.org/Frameworks
license     :
    - BSD-2-Clause
    - BSD-3-Clause
    - GPL-3.0-or-later
    - LGPL-2.0-or-later
summary     : KDE library for regional holiday information
description : |
    KDE library for regional holiday information
builddeps   :
