name        : kwrited
version     : "6.7.5"
release     : 22
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/kwrited-6.7.5.tar.xz : f8aa905734d0ccde796884cfcb06b36084e441fb199ea5aab2bc92cfa4c0506d
homepage    : https://kde.org/plasma-desktop/
license     : GPL-2.0-or-later
summary     : KDE daemon listening for wall and write messages
description : |
    KDE daemon listening for wall and write messages.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6CoreAddons)
    - cmake(KF6I18n)
    - cmake(KF6Notifications)
    - cmake(KF6Pty)
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
