name        : libnice
version     : "0.1.24"
release     : 4
upstreams   :
    - https://gitlab.freedesktop.org/libnice/libnice/-/archive/0.1.24/libnice-0.1.24.tar.gz : 1da5ac13ed5d4e175e0d2d46ad3748c6635244f8f3eb2b8e31578ef59aa2ddce
homepage    : https://nice.freedesktop.org
license     :
    - MPL-1.1
    - LGPL-2.1-or-later
summary     : The GLib ICE implementation
description : |
    Libnice is an implementation of the IETF's Interactive Connectivity Establishment (ICE) standard (RFC 5245) and the Session Traversal Utilities for NAT (STUN) standard (RFC 5389).
builddeps   :
    - binary(g-ir-scanner)
    - pkgconfig(gio-2.0)
    - pkgconfig(gstreamer-base-1.0)
    - pkgconfig(gupnp-igd-1.6)
setup       : |
    %patch %(pkgdir)/255.patch

    %meson \
        -Dcrypto-library=openssl
build       : |
    %meson_build
install     : |
    %meson_install
packages    :
    - "gstreamer-plugin-%(name)":
        summary: gstreamer plugin for %(name)
        description: gstreamer plugin for %(name)
        paths:
            - /usr/lib/gstreamer-1.0/libgstnice.so
