name        : egl-gbm
version     : "1.1.4"
release     : 7
homepage    : https://github.com/NVIDIA/egl-gbm
upstreams   :
    - https://github.com/NVIDIA/egl-gbm/archive/refs/tags/1.1.4.tar.gz : 9738d7961550a67f2fcca5923374d1869ac214e00e96da6393b7206e3ef293e0
summary     : EGL External Platform for GBM
description : |
    EGL External Platform for GBM
license     : MIT
emul32      : true
builddeps   :
    - pkgconfig(eglexternalplatform)
    - pkgconfig32(egl)
    - pkgconfig32(gbm)
    - pkgconfig32(libdrm)
packages    :
    # Suppress devel subpackages
    - "%(name)":
        paths:
            - /usr/lib/*.so*
    - "%(name)-32bit":
        paths:
            - /usr/lib32/*.so*
setup       : |
    %meson
build       : |
    %meson_build
install     : |
    %meson_install
