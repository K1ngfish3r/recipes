name        : libpcap
version     : "1.10.7"
release     : 8
homepage    : https://www.tcpdump.org/
upstreams   :
    - https://www.tcpdump.org/release/libpcap-1.10.7.tar.gz : 0b394ac90dbc0a9838ff97468e05c9c9a3e873dec2514cd58db65d859d296e31
summary     : Platform-independent network traffic capture library
description : |
    Platform-independent network traffic capture library
license     :
    - BSD-3-Clause
builddeps   :
    - binary(flex)
    - binary(yacc)
    - pkgconfig(bluez)
    - pkgconfig(dbus-1)
    - pkgconfig(libnl-3.0)
setup       : |
    %configure \
        --disable-static \
        --enable-ipv6 \
        --with-libnl
build       : |
    %make
install     : |
    %make_install
    rm -v %(installroot)/%(libdir)/libpcap.a
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/pcap-config
            - /usr/share/man/man1/pcap-config*
            - /usr/share/man/man5/
