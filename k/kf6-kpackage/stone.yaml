name        : kf6-kpackage
version     : "6.30.0"
release     : 21
upstreams   :
    - https://download.kde.org/stable/frameworks/6.30/kpackage-6.30.0.tar.xz : 58939af0c553f24963652e10d248e2f8f2b2ca2b87dc26d3220675ed0cf33019
homepage    : https://community.kde.org/Frameworks
license     :
    - GPL-2.0-or-later
    - LGPL-2.0-or-later
summary     : Installation and loading of additional content as packages
description : |
    Installation and loading of additional content (scripts, images...) as packages.
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6Archive)
    - cmake(KF6CoreAddons)
    - cmake(KF6DocTools)
    - cmake(KF6I18n)
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
