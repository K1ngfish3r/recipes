name        : plasma-bigscreen
version     : "6.7.5"
release     : 6
upstreams   :
    - https://download.kde.org/stable/plasma/6.7.5/plasma-bigscreen-6.7.5.tar.xz : fd00b8ffd6a1c0fd7058acd06098110b00b5ca1dc720167058fad65d2ab50bdc
homepage    : https://kde.org/plasma-desktop/
license     : GPL-2.0-or-later
summary     : Plasma shell for TVs
description : |
    Plasma shell for TVs
builddeps   :
    # Temporary, boulder doesn't handle build ordering resolution correctly when builddeps are added by macros, so add ECM manually
    - cmake(ECM)
    - cmake(KF6BluezQt)
    - cmake(KF6Config)
    - cmake(KF6DBusAddons)
    - cmake(KF6GlobalAccel)
    - cmake(KF6I18n)
    - cmake(KF6IconThemes)
    - cmake(KF6KCMUtils)
    - cmake(KF6KIO)
    - cmake(KF6Kirigami)
    - cmake(KF6Notifications)
    - cmake(KF6Screen)
    - cmake(KF6Svg)
    - cmake(KF6WindowSystem)
    - cmake(LibKWorkspace)
    - cmake(LibTaskManager)
    - cmake(Plasma)
    - cmake(Plasma5Support)
    - cmake(PlasmaActivities)
    - cmake(PlasmaActivitiesStats)
    - cmake(PlasmaWaylandProtocols)
    - cmake(QCoro6)
    - cmake(Qt6Core5Compat)
    - cmake(Qt6Multimedia)
    - cmake(Qt6Qml)
    - cmake(Qt6WaylandClient)
    - cmake(Qt6WaylandGlobalPrivate)
    - cmake(Qt6WebEngineCore)
    - cmake(SDL3)
    - pkgconfig(libcec)
rundeps     :
    # https://bugs.kde.org/show_bug.cgi?id=522585
    - kdeconnect
    - kf6-kirigami
    - plasma-nano
    - plasma-workspace
    - qqc2-breeze-style
    - qt6-5compat
tuning      :
    - lto: full
    - optimize: speed
setup       : |
    %cmake_kf6
build       : |
    %cmake_build
install     : |
    %cmake_install
